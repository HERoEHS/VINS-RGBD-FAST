%YAML:1.0

# ================================================================
# edie9 stereo camera + ICM-42688-P IMU
# Calibrated with Kalibr (run4/run6, pinhole-radtan, non-RS)
# Source: viso_inertial_calib/backup/run4_camchain.yaml + imu.yaml
# ================================================================

num_threads: 0

#common parameters
imu: 1
static_init: 1
imu_topic: "/edie/sensor/offset_imu"
image_topic: "/edie/sensors/camera/left/image_gray"
depth_topic: "/edie/sensors/camera/left/depth"
output_path: "/tmp/vins_edie_output"

#RGBD camera valid depth range
depth_min_dist: 0.3
depth_max_dist: 3.5

frontend_freq: 15
keyframe_parallax: 10.0
num_grid_rows: 7
num_grid_cols: 8

#camera calibration (cam0 = left, pinhole-radtan)
model_type: PINHOLE
camera_name: camera
image_width: 640
image_height: 480

distortion_parameters:
   k1: -0.3693579897
   k2:  0.1036239626
   p1:  0.0026066921
   p2:  0.0011778818

projection_parameters:
   fx: 438.3070880664
   fy: 436.7964460490
   cx: 310.3360344030
   cy: 262.3331851983

# Extrinsic: IMU(body) ← camera
# R_imu_cam = R_cam_imu^T  (Kalibr T_cam_imu 상단 3x3 전치)
# t_imu_cam = -R_imu_cam * t_cam_imu
estimate_extrinsic: 1   # 1 = 초기값 제공 후 온라인 미세조정 (캘리브 reprojection 35px로 약간 높음)
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 0.0619017800,  0.5926734600,  0.8030606100,
          -0.9955198000, -0.0209548500,  0.0922020400,
           0.0714737100, -0.8051702100,  0.5887210200]
extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [0.1866642923, 0.0206996488, -0.0955281329]

#feature tracker parameters
max_cnt: 150     # 게이트② 관점에선 max_cnt↑ = CPU↑ → 오히려 불리
min_dist: 25
freq: 10
F_threshold: 1.0
show_track: 1
equalize: 1 #0
fisheye: 0

#optimization parameters
max_solver_time: 0.04
max_num_iterations: 8

# IMU noise parameters (Allan variance, ICM-42688-P @382Hz)
acc_n: 0.004424663056   # accelerometer noise density [m/s^2/sqrt(Hz)]
gyr_n: 0.000178894435   # gyroscope noise density    [rad/s/sqrt(Hz)]
acc_w: 0.000381885117   # accelerometer random walk  [m/s^3/sqrt(Hz)]
gyr_w: 0.000020782226   # gyroscope random walk      [rad/s^2/sqrt(Hz)]

g_norm: 9.81

# Time offset: t_imu = t_cam + td  (cam0 Kalibr result: 12.656ms)
estimate_td: 1          # 1 = 온라인 추정 (초기값으로 수렴 가속)
td: 0.012655922077

#rolling shutter (ELP stereo: global shutter)
rolling_shutter: 0
rolling_shutter_tr: 0.0

#loop closure
loop_closure: 1
fast_relocalization: 0
load_previous_pose_graph: 0
pose_graph_save_path: "/tmp/vins_edie_output/pose_graph"

#visualization
save_image: 0
visualize_imu_forward: 0
visualize_camera_size: 0.4
